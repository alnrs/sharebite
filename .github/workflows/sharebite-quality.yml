
name: "ShareBite 604AZ | Enterprise Quality Assurance Pipeline"

run-name: "ShareBite 604AZ • Professional Verification • ${{ github.ref_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sharebite-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ============================================================
  # 01 - REPOSITORY STRUCTURE
  # ============================================================

  structure:
    name: "01 | Repository Structure and Project Integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout ShareBite source code"
        uses: actions/checkout@v4

      - name: "Verify essential directories"
        run: |
          set -euo pipefail

          directories=(
            "assets"
            "css"
            "js"
            "infrastructure"
            "tools"
          )

          for directory in "${directories[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "::error::Missing directory: $directory"
              exit 1
            fi

            echo "PASS | $directory"
          done

      - name: "Verify essential website files"
        run: |
          set -euo pipefail

          files=(
            "index.html"
            "login.html"
            "register.html"
            "dashboard.html"
            "browse.html"
            "add-food.html"
            "messages.html"
            "package.json"
            "amplify.yml"
          )

          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty file: $file"
              exit 1
            fi

            echo "PASS | $file"
          done

      - name: "Publish structure report"
        run: |
          {
            echo "## 01 — Repository Structure"
            echo ""
            echo "✅ Required directories verified."
            echo ""
            echo "✅ Essential website files verified."
            echo ""
            echo "✅ ShareBite source structure is available."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 02 - HTML SOURCE QUALITY
  # ============================================================

  html:
    name: "02 | HTML Pages and Markup Validation"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Parse ShareBite HTML pages"
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class PageParser(HTMLParser):
              pass

          pages = sorted(Path(".").glob("*.html"))

          if not pages:
              raise SystemExit("No HTML pages were found")

          for page in pages:
              content = page.read_text(encoding="utf-8")

              if not content.strip():
                  raise SystemExit(f"Empty HTML page: {page}")

              if "<html" not in content.lower():
                  raise SystemExit(f"Missing HTML element: {page}")

              if "<head" not in content.lower():
                  raise SystemExit(f"Missing head element: {page}")

              if "<body" not in content.lower():
                  raise SystemExit(f"Missing body element: {page}")

              parser = PageParser()
              parser.feed(content)
              parser.close()

              print(f"PASS | {page}")

          print(f"TOTAL | {len(pages)} pages checked")
          PY

      - name: "Write HTML report"
        run: |
          {
            echo "## 02 — HTML Quality"
            echo ""
            echo "✅ HTML pages passed basic structural checks."
            echo ""
            echo "✅ HTML parser completed without errors."
            echo ""
            echo "Note: This is not full W3C conformance testing."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 03 - CSS QUALITY
  # ============================================================

  css:
    name: "03 | CSS Stylesheet Availability"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: "Check premium design stylesheets"
        run: |
          set -euo pipefail

          mapfile -d '' stylesheets < <(
            find css -type f -name '*.css' -print0
          )

          if [[ ${#stylesheets[@]} -eq 0 ]]; then
            echo "::error::No CSS stylesheets found"
            exit 1
          fi

          for stylesheet in "${stylesheets[@]}"; do
            if [[ ! -s "$stylesheet" ]]; then
              echo "::error::Empty stylesheet: $stylesheet"
              exit 1
            fi

            echo "PASS | $stylesheet"
          done

      - name: "Publish CSS report"
        run: |
          {
            echo "## 03 — Frontend Styling"
            echo ""
            echo "✅ CSS files exist and contain content."
            echo ""
            echo "✅ ShareBite styling assets are included."
            echo ""
            echo "Visual appearance requires browser verification."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 04 - JAVASCRIPT QUALITY
  # ============================================================

  javascript:
    name: "04 | JavaScript and Frontend Bundle Validation"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Verify essential scripts"
        run: |
          set -euo pipefail

          scripts=(
            "js/config.js"
            "js/auth.js"
            "js/sharebite.bundle.js"
          )

          for script in "${scripts[@]}"; do
            test -s "$script"
            echo "PASS | $script"
          done

      - name: "Check JavaScript syntax"
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            node --check "$file"
            echo "PASS | $file"
            count=$((count + 1))
          done < <(
            find js tools \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              -print0
          )

          if [[ "$count" -eq 0 ]]; then
            echo "::error::No JavaScript sources found"
            exit 1
          fi

          echo "TOTAL | $count JavaScript files"

      - name: "Publish JavaScript report"
        run: |
          {
            echo "## 04 — JavaScript Verification"
            echo ""
            echo "✅ Frontend JavaScript files present."
            echo ""
            echo "✅ JavaScript syntax checks passed."
            echo ""
            echo "✅ Browser bundle found."
            echo ""
            echo "Live Cognito login is not tested here."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 05 - PYTHON LAMBDA QUALITY
  # ============================================================

  python:
    name: "05 | AWS Lambda Python Source Validation"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Parse backend Python files"
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = []

          for directory in ("backend", "infrastructure"):
              root = Path(directory)

              if root.exists():
                  files.extend(root.rglob("*.py"))

          files = sorted(set(files))

          if not files:
              raise SystemExit("No Lambda Python source found")

          for file in files:
              source = file.read_text(encoding="utf-8")

              ast.parse(source, filename=str(file))

              print(f"PASS | {file}")

          print(f"TOTAL | {len(files)} Python files")
          PY

      - name: "Publish Lambda source report"
        run: |
          {
            echo "## 05 — Lambda Python"
            echo ""
            echo "✅ Python source syntax passed."
            echo ""
            echo "✅ Backend source files were parsed."
            echo ""
            echo "No AWS Lambda code was executed or deployed."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 06 - AWS CONFIGURATION
  # ============================================================

  aws-config:
    name: "06 | AWS Cloud Configuration Source Review"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: "Review frontend AWS settings"
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path("js/config.js")

          content = config.read_text(encoding="utf-8")

          required = [
              "region",
              "apiBaseUrl",
              "userPoolId",
              "userPoolClientId",
          ]

          for setting in required:
              if setting not in content:
                  raise SystemExit(
                      f"Missing setting: {setting}"
                  )

              print(f"PASS | {setting}")

          print("Required configuration names present")
          PY

      - name: "Review infrastructure directory"
        run: |
          set -euo pipefail

          test -d infrastructure

          echo "PASS | Infrastructure directory exists"

      - name: "Publish configuration report"
        run: |
          {
            echo "## 06 — AWS Source Configuration"
            echo ""
            echo "✅ Required configuration keys present."
            echo ""
            echo "✅ Infrastructure directory present."
            echo ""
            echo "No AWS credentials were requested."
            echo ""
            echo "Live AWS connectivity was not verified."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 07 - FRONTEND ASSET VERIFICATION
  # ============================================================

  assets:
    name: "07 | Images and Static Asset Verification"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: "Inspect local assets"
        run: |
          set -euo pipefail

          test -d assets

          count=$(find assets -type f | wc -l)

          if [[ "$count" -lt 1 ]]; then
            echo "::error::Assets directory is empty"
            exit 1
          fi

          echo "PASS | $count local asset files"

      - name: "Publish asset report"
        run: |
          {
            echo "## 07 — Asset Verification"
            echo ""
            echo "✅ Static asset files found."
            echo ""
            echo "✅ Asset directory available to the frontend."
            echo ""
            echo "Amazon S3 photograph upload is not tested."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 08 - SECURITY SCANNING
  # ============================================================

  security:
    name: "08 | Repository Security and Private-Key Protection"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: "Check for actual PEM private-key headers"
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          # Construct the pattern without including a literal
          # private-key header as a complete line in this file.
          prefix = chr(45) * 5
          suffix = chr(45) * 5

          key_types = (
              "",
              "RSA ",
              "EC ",
              "DSA ",
              "OPENSSH ",
              "ENCRYPTED ",
          )

          markers = [
              prefix + "BEGIN " + kind + "PRIVATE KEY" + suffix
              for kind in key_types
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              capture_output=True,
              check=True,
          )

          filenames = [
              name.decode("utf-8", errors="replace")
              for name in result.stdout.split(b"\0")
              if name
          ]

          suspicious = []

          for filename in filenames:
              path = Path(filename)

              if not path.is_file():
                  continue

              try:
                  raw = path.read_bytes()
              except OSError:
                  continue

              if b"\0" in raw[:4096]:
                  continue

              text = raw.decode("utf-8", errors="ignore")

              for line in text.splitlines():
                  stripped = line.strip()

                  if stripped in markers:
                      suspicious.append(filename)
                      break

          if suspicious:
              for filename in suspicious:
                  print(f"SECURITY WARNING | {filename}")

              raise SystemExit(
                  "Potential PEM private-key material detected"
              )

          print(
              f"PASS | Scanned {len(filenames)} tracked files"
          )

          print("PASS | No matching PEM key headers found")
          PY

      - name: "Check tracked environment secret files"
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              capture_output=True,
              check=True,
          )

          names = [
              value.decode("utf-8", errors="replace")
              for value in result.stdout.split(b"\0")
              if value
          ]

          forbidden = {
              ".env",
              ".env.production",
              ".env.local",
              ".env.development",
              "credentials",
              "credentials.json",
              "aws_access_keys.csv",
          }

          bad = []

          for name in names:
              base = PurePosixPath(name).name.lower()

              if base in forbidden:
                  bad.append(name)

          if bad:
              for filename in bad:
                  print(f"WARNING | {filename}")

              raise SystemExit(
                  "Potential secret configuration files are tracked"
              )

          print("PASS | No prohibited secret filenames found")
          PY

      - name: "Publish security report"
        run: |
          {
            echo "## 08 — Repository Security"
            echo ""
            echo "✅ Tracked files checked for PEM private-key headers."
            echo ""
            echo "✅ Common secret environment filenames checked."
            echo ""
            echo "✅ No AWS authentication credentials required."
            echo ""
            echo "This is a focused check, not a complete security audit."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 09 - BUILD CONFIGURATION
  # ============================================================

  build-config:
    name: "09 | Amplify Hosting Configuration Review"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: "Validate package.json"
        run: |
          node - <<'JS'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (!pkg.name) {
            throw new Error("Package name missing");
          }

          console.log("PASS | Package metadata");

          if (pkg.scripts && pkg.scripts.build) {
            console.log(
              "BUILD SCRIPT | " + pkg.scripts.build
            );
          } else {
            console.log(
              "INFO | No package build script declared"
            );
          }
          JS

      - name: "Check Amplify configuration"
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("amplify.yml")

          content = path.read_text(encoding="utf-8")

          if not content.strip():
              raise SystemExit("Amplify config is empty")

          for item in ("frontend:", "artifacts:", "baseDirectory:"):
              if item not in content:
                  raise SystemExit(
                      f"Missing Amplify configuration field: {item}"
                  )

              print(f"PASS | {item}")
          PY

      - name: "Publish Amplify review"
        run: |
          {
            echo "## 09 — Amplify Hosting Configuration"
            echo ""
            echo "✅ package.json parsed successfully."
            echo ""
            echo "✅ Required Amplify configuration fields found."
            echo ""
            echo "The production website was not redeployed."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 10 - WEBSITE NAVIGATION SOURCE
  # ============================================================

  navigation:
    name: "10 | Website Navigation and Page Availability"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: "Check primary navigation destinations"
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              "index.html",
              "browse.html",
              "login.html",
              "register.html",
              "dashboard.html",
              "add-food.html",
              "messages.html",
              "profile.html",
          ]

          for page in pages:
              path = Path(page)

              if not path.is_file():
                  raise SystemExit(
                      f"Required destination missing: {page}"
                  )

              if not path.stat().st_size:
                  raise SystemExit(
                      f"Empty destination: {page}"
                  )

              print(f"PASS | {page}")
          PY

      - name: "Publish navigation verification"
        run: |
          {
            echo "## 10 — Navigation"
            echo ""
            echo "✅ Main page destinations exist."
            echo ""
            echo "✅ Profile and message pages are present."
            echo ""
            echo "Browser navigation behavior remains untested."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 11 - REPOSITORY DOCUMENTATION
  # ============================================================

  documentation:
    name: "11 | Documentation and Project Evidence Review"
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: "Check deployment documentation"
        run: |
          set -euo pipefail

          docs=(
            "DEPLOYMENT_GUIDE.md"
            "AWS_LIVE_CONNECTION_GUIDE.md"
            "README_FIRST_OPEN_THIS.md"
          )

          for file in "${docs[@]}"; do
            test -s "$file"
            echo "PASS | $file"
          done

      - name: "Publish documentation summary"
        run: |
          {
            echo "## 11 — Project Documentation"
            echo ""
            echo "✅ Deployment guide available."
            echo ""
            echo "✅ AWS connection guide available."
            echo ""
            echo "✅ Project startup documentation available."
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 12 - FINAL PROJECT QUALITY REPORT
  # ============================================================

  final-report:
    name: "12 | Final ShareBite Quality Assurance Report"
    runs-on: ubuntu-latest

    if: always()

    needs:
      - structure
      - html
      - css
      - javascript
      - python
      - aws-config
      - assets
      - security
      - build-config
      - navigation
      - documentation

    timeout-minutes: 5

    steps:
      - name: "Generate professional verification report"
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          results = json.loads(
              os.environ["RESULTS_JSON"]
          )

          checks = [
              ("structure", "Repository Structure"),
              ("html", "HTML Page Quality"),
              ("css", "CSS Stylesheets"),
              ("javascript", "JavaScript Syntax"),
              ("python", "Lambda Python Syntax"),
              ("aws-config", "AWS Configuration Source"),
              ("assets", "Static Asset Availability"),
              ("security", "Repository Security"),
              ("build-config", "Amplify Build Configuration"),
              ("navigation", "Website Page Availability"),
              ("documentation", "Project Documentation"),
          ]

          passed = 0
          failed = []

          report = [
              "# ShareBite 604AZ",
              "",
              "## Professional Quality Assurance Report",
              "",
              f"**Repository:** `{os.environ['REPOSITORY_NAME']}`",
              "",
              f"**Branch:** `{os.environ['BRANCH_NAME']}`",
              "",
              f"**Commit:** `{os.environ['COMMIT_SHA'][:12]}`",
              "",
              "**Generated:** "
              + datetime.now(timezone.utc).strftime(
                  "%Y-%m-%d %H:%M UTC"
              ),
              "",
              "---",
              "",
              "## Verification Matrix",
              "",
              "| No. | Quality Area | Result |",
              "|---|---|---|",
          ]

          for index, (key, label) in enumerate(
              checks, start=1
          ):
              result = results.get(
                  key, {}
              ).get("result", "missing")

              if result == "success":
                  status = "✅ PASSED"
                  passed += 1
              elif result == "skipped":
                  status = "⏭️ SKIPPED"
                  failed.append(label)
              elif result == "cancelled":
                  status = "⚪ CANCELLED"
                  failed.append(label)
              else:
                  status = f"❌ {result.upper()}"
                  failed.append(label)

              report.append(
                  f"| {index:02d} | {label} | {status} |"
              )

          total = len(checks)

          report.extend([
              "",
              "---",
              "",
              "## Quality Verification Summary",
              "",
              f"**Passed checks:** {passed}/{total}",
              "",
              f"**Remaining checks:** {total - passed}",
              "",
          ])

          if not failed:
              report.extend([
                  "### ✅ All Repository Quality Checks Passed",
                  "",
                  "All configured source-level verification "
                  "jobs completed successfully.",
              ])
          else:
              report.extend([
                  "### ❌ Additional Work Required",
                  "",
                  "One or more source-level verification "
                  "jobs did not pass.",
                  "",
                  "**Review these areas:**",
                  "",
              ])

              for label in failed:
                  report.append(f"- {label}")

          report.extend([
              "",
              "---",
              "",
              "## Scope and Limitations",
              "",
              "This report verifies repository contents "
              "and basic source quality.",
              "",
              "It does not establish the operational status of:",
              "",
              "- Amazon Cognito sign-in",
              "- API Gateway and Lambda connectivity",
              "- DynamoDB food-listing persistence",
              "- S3 photograph uploads and display",
              "- Donor-recipient messaging",
              "- Mobile-browser compatibility",
              "- Production uptime or availability",
              "",
              "Those capabilities must be verified "
              "with separate live integration tests.",
              "",
              "---",
              "",
              "## Deployment Safety",
              "",
              "This workflow does not:",
              "",
              "- Deploy AWS infrastructure",
              "- Modify Lambda functions",
              "- Change Cognito user pools",
              "- Write to DynamoDB",
              "- Upload or delete S3 objects",
              "- Change Amplify hosting settings",
              "",
              "The workflow operates on the checked-out "
              "GitHub repository only.",
              "",
              "---",
              "",
              "**ShareBite 604AZ — Automated Quality Report**",
          ])

          output = "\n".join(report) + "\n"

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as file:
              file.write(output)

          print(output)

          if failed:
              raise SystemExit(
                  "Quality verification incomplete: "
                  + ", ".join(failed)
              )

          print("FINAL RESULT: ALL CHECKS PASSED")
          PY
