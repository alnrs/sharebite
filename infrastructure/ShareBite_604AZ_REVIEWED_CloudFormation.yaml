      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ShareBiteHttpApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt GatewayLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","status":"$context.status",
          "routeKey":"$context.routeKey","responseLatency":"$context.responseLatency",
          "integrationError":"$context.integrationErrorMessage"}
      Tags: {Project: ShareBite, Module: 604AZ}

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ShareBiteFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ShareBiteHttpApi}/*/*'

  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-lambda-errors'
      AlarmDescription: One or more Lambda errors in a five-minute period.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ShareBiteFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [WithNotifications, [!Ref DonationTopic], !Ref AWS::NoValue]

  AmplifyScaffold:
    Type: AWS::Amplify::App
    Condition: WithAmplify
    Properties:
      Name: !Sub '${ProjectName}-frontend'
      Platform: WEB
      Description: >-
        Empty static frontend scaffold. A manual deployment or an authorized
        GitHub connection is required before any pages will be accessible.
      Tags:
        - {Key: Project, Value: ShareBite}
        - {Key: Module, Value: 604AZ}

  AmplifyMainBranch:
    Type: AWS::Amplify::Branch
    Condition: WithAmplify
    Properties:
      AppId: !GetAtt AmplifyScaffold.AppId
      BranchName: main
      EnableAutoBuild: false
      Stage: DEVELOPMENT


  # EventBridge expiry worker only updates timezone-aware listing timestamps.
  ExpiryCleanupFunction:
    Type: AWS::Lambda::Function
    Condition: WithExpiry
    DependsOn: ExpiryLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-expiry'
      Runtime: python3.12
      Handler: index.handler
      Role: !If
        - NewLambdaRole
        - !GetAtt DedicatedExecutionRole.Arn
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}'
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          LISTINGS_TABLE: !Ref ListingsTable
      Code:
        ZipFile: |
          """EventBridge optional expiration maintenance for timezone-aware food listings."""
          import json
          import os
          import time
          from datetime import datetime, timezone
          import boto3
          from boto3.dynamodb.conditions import Key
          from botocore.exceptions import ClientError

          T = boto3.resource('dynamodb').Table(os.environ['LISTINGS_TABLE'])

          def handler(event, context):
              now = int(time.time())
              expired = 0
              checked = 0
              options = {'IndexName':'ExpiryIndex',
                         'KeyConditionExpression':Key('status').eq('Available') & Key('expiryEpoch').lte(now),
                         'Limit':50, 'ProjectionExpression':'listingId, #st, expiryEpoch',
                         'ExpressionAttributeNames':{'#st':'status'}}
              while checked < 200:
                  results = T.query(**options)
                  for item in results.get('Items', []):
                      checked += 1
                      try:
                          T.update_item(Key={'listingId':item['listingId']},
                            ConditionExpression='#st = :active AND expiryEpoch <= :now',
                            UpdateExpression='SET #st = :expired',
                            ExpressionAttributeNames={'#st':'status'},
                            ExpressionAttributeValues={':active':'Available', ':expired':'Expired', ':now':now})
                          expired += 1
                      except ClientError as exc:
                          if exc.response.get('Error',{}).get('Code')!='ConditionalCheckFailedException':
                              raise
                  marker = results.get('LastEvaluatedKey')
                  if not marker or checked >= 200:
                      break
                  options['ExclusiveStartKey'] = marker
              print(json.dumps({'event':'expiry_cleanup','checked':checked,'expired':expired,
                                'utc':datetime.now(timezone.utc).isoformat()}))
              return {'checked':checked,'expired':expired}

  ExpiryEventRule:
    Type: AWS::Events::Rule
    Condition: WithExpiry
    Properties:
      Description: Hourly cleanup for expired ShareBite listings (UTC offsets only).
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ExpiryCleanupFunction.Arn
          Id: ShareBiteExpiryWorker

  ExpiryInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: WithExpiry
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExpiryCleanupFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpiryEventRule.Arn

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-5xx'
      AlarmDescription: HTTP API reported 5xx errors within five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - {Name: ApiId, Value: !Ref ShareBiteHttpApi}
        - {Name: Stage, Value: !Ref ApiStage}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [WithNotifications, [!Ref DonationTopic], !Ref AWS::NoValue]

  ShareBiteDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: WithDashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-operations'
      DashboardBody: !Sub |
        {"widgets":[{"type":"metric","x":0,"y":0,"width":12,"height":6,
        "properties":{"metrics":[["AWS/Lambda","Invocations","FunctionName","${ShareBiteFunction}"],
        ["AWS/Lambda","Errors","FunctionName","${ShareBiteFunction}"]],
        "view":"timeSeries","stat":"Sum","period":300,"region":"${AWS::Region}",
        "title":"ShareBite backend activity and errors"}}]}

  # Alternative to Amplify: a secure, private static-site S3 origin behind CloudFront.
  # This is empty on deployment; upload your website files yourself.
  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Condition: WithStaticHosting
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}
      Tags:
        - {Key: Project, Value: ShareBite}
        - {Key: Component, Value: Website}

  StaticOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: WithStaticHosting
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-static-oac'
        Description: CloudFront signed access to a private ShareBite S3 origin.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  EdgeManagedWAF:
    Type: AWS::WAFv2::WebACL
    Condition: WithEdgeWAF
    Properties:
      Name: !Sub '${ProjectName}-edge-waf'
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-edge-waf'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedCommonRuleSet
          Priority: 0
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${ProjectName}-common-rules'
            SampledRequestsEnabled: true

  StaticCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: WithStaticHosting
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ShareBite private static site; alternative to Amplify Hosting.
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        WebACLId: !If [WithEdgeWAF, !GetAtt EdgeManagedWAF.Arn, !Ref AWS::NoValue]
        Origins:
          - Id: ShareBitePrivateStaticOrigin
            DomainName: !GetAtt StaticWebsiteBucket.RegionalDomainName
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !GetAtt StaticOriginAccess.Id
        DefaultCacheBehavior:
          TargetOriginId: ShareBitePrivateStaticOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
      Tags:
        - {Key: Project, Value: ShareBite}
        - {Key: Module, Value: 604AZ}

  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: WithStaticHosting
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSpecificCloudFrontDistributionRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: [s3:GetObject]
            Resource: !Sub '${StaticWebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${StaticCloudFrontDistribution}'

  # Optional daily AWS Backup coverage for DynamoDB. Do not enable until the
  # correct existing AWS Backup service role/feature permissions are verified.
  ShareBiteBackupVault:
    Type: AWS::Backup::BackupVault
    Condition: WithBackup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub '${ProjectName}-backup-vault'

  ShareBiteBackupPlan:
    Type: AWS::Backup::BackupPlan
    Condition: WithBackup
    Properties:
      BackupPlan:
        BackupPlanName: !Sub '${ProjectName}-daily-dynamodb'
        BackupPlanRule:
          - RuleName: DailyAt0300UTC
            TargetBackupVault: !Ref ShareBiteBackupVault
            ScheduleExpression: cron(0 3 ? * * *)
            StartWindowMinutes: 120
            CompletionWindowMinutes: 360
            Lifecycle: {DeleteAfterDays: 30}

  ShareBiteBackupSelection:
    Type: AWS::Backup::BackupSelection
    Condition: WithBackup
    Properties:
      BackupPlanId: !Ref ShareBiteBackupPlan
      BackupSelection:
        SelectionName: ShareBiteDynamoDB
        IamRoleArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/service-role/${ExistingBackupRoleName}'
        Resources:
          - !GetAtt ListingsTable.Arn
          - !GetAtt ConversationsTable.Arn
          - !GetAtt MessagesTable.Arn
          - !GetAtt RatingsTable.Arn

